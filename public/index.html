<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Map</title>
  <meta name="description" content="전 세계 AI 기업의 위치, 리더, 주력 제품, 주가를 지도에서 한눈에">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bf6'/%3E%3Ccircle cx='16' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M16 20v6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Set the theme before first paint so dark-mode users don't see a light flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('aimap-theme'); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="sidebarToggle" type="button" aria-label="기업 목록 열기" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="./" aria-label="AI Map 홈">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="10" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 14.5V21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        <span class="brand__name">AI Map</span>
      </a>
      <nav class="segmented view-switch" id="viewSwitch" aria-label="화면 전환">
        <button type="button" data-view="map" aria-pressed="true">지도</button>
        <button type="button" data-view="board" aria-pressed="false">비교 보드</button>
        <button type="button" data-view="graph" aria-pressed="false">관계도</button>
        <button type="button" data-view="models" aria-pressed="false">모델</button>
        <button type="button" data-view="report" aria-pressed="false">리포트</button>
        <button type="button" data-view="watchlist" aria-pressed="false" aria-label="관심 기업"><span class="fav-mark" aria-hidden="true">★</span>관심</button>
      </nav>
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="기업, 인물, 제품, 도시 검색" autocomplete="off" aria-label="검색">
      </label>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="다크 모드 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="사이드바">
      <div class="sidebar__modes">
        <div class="segmented segmented--full" role="group" aria-label="보기 전환" id="sidebarModes">
          <button type="button" data-mode="companies" aria-pressed="true">기업</button>
          <button type="button" data-mode="briefing" aria-pressed="false">AI 브리핑 <span class="mode-badge" id="briefingBadge"></span></button>
          <button type="button" data-mode="datacenters" aria-pressed="false">데이터센터</button>
        </div>
      </div>

      <div class="sidebar__pane" id="companyPane">
        <div class="sidebar__controls">
          <div class="chips" id="categoryChips" role="group" aria-label="분야 필터"></div>
          <div class="sidebar__row">
            <span class="list-meta" id="listMeta"></span>
            <label class="switch">
              <input type="checkbox" id="listedOnly">
              <span class="switch__track" aria-hidden="true"></span>
              상장사만
            </label>
          </div>
        </div>
        <ul class="company-list" id="companyList"></ul>
        <p class="sidebar__foot" id="dataFoot"></p>
      </div>

      <div class="sidebar__pane" id="briefingPane" hidden></div>
      <div class="sidebar__pane" id="dcPane" hidden></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="map-wrap">
      <div id="map" aria-label="세계 지도"></div>
      <section class="detail" id="detail" aria-live="polite" hidden></section>
    </main>

    <section class="board" id="board" aria-label="상장사 비교 보드" hidden></section>
    <section class="board relations" id="relations" aria-label="AI 기업 관계도" hidden></section>
    <section class="board models" id="models" aria-label="AI 모델 출시 타임라인" hidden></section>
    <section class="board report" id="report" aria-label="주간 AI 리포트" hidden></section>
    <section class="board watchlist" id="watchlist" aria-label="관심 기업" hidden></section>
  </div>
  <div class="viz-tooltip" id="vizTooltip" role="tooltip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="data/companies.js"></script>
  <script src="data/relations.js"></script>
  <script src="data/models.js"></script>
  <script src="data/datacenters.js"></script>
  <script src="data/overrides.js"></script>
  <script src="board.js"></script>
  <script src="relations.js"></script>
  <script src="models.js"></script>
  <script src="report.js"></script>
  <script src="watchlist.js"></script>
  <script src="datacenters.js"></script>
  <script src="app.js"></script>
</body>
</html>
