<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Map 데이터 점검</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('aimap-theme'); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
</head>
<body class="admin-page">
  <header class="topbar">
    <a class="brand" href="./" aria-label="AI Map 지도로">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="10" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 14.5V21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <span class="brand__name">AI Map</span>
    </a>
    <span class="admin-badge">데이터 점검</span>
    <a class="link-btn admin-back" href="./">← 지도로</a>
  </header>
  <main class="admin" id="admin" aria-live="polite"></main>

  <script src="data/companies.js"></script>
  <script src="data/relations.js"></script>
  <script src="data/overrides.js"></script>
  <script src="admin.js"></script>
</body>
</html>
